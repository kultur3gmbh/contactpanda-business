name: Build and publish ContactPanda Business package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build installable ZIP files
        run: ./tools/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: contactpanda-business-package
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
          for asset in dist/*; do
            name="${asset##*/}"
            gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes >/dev/null 2>&1 || true
            gh release upload "$GITHUB_REF_NAME" "$asset"
          done
